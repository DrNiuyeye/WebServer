<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="data:;base64,=">
        <title>Private Cloud</title>
        <script>
            function confirmDelete() {
                return confirm("Delete this file?");
            }

            function uploadWin() {
                var overlay = document.getElementById("overlay");
                overlay.style.display = "grid";
            }
        </script>
        <style>
            :root {
                --bg: #101418;
                --panel: #f7f9fb;
                --surface: #ffffff;
                --text: #17202a;
                --muted: #667085;
                --line: #d9e0e8;
                --accent: #1f7a5b;
                --accent-dark: #176248;
                --danger: #b42318;
                --shadow: 0 14px 40px rgba(16, 20, 24, 0.16);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: "Segoe UI", Arial, sans-serif;
                color: var(--text);
                background: #e9eef3;
            }

            .topbar {
                background: var(--bg);
                color: white;
                padding: 18px 24px;
            }

            .topbar-inner {
                max-width: 960px;
                margin: 0 auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
            }

            .brand {
                font-size: 18px;
                font-weight: 700;
            }

            .userbox {
                display: flex;
                align-items: center;
                gap: 12px;
                color: #d9e0e8;
                font-size: 14px;
            }

            .logout {
                color: white;
                text-decoration: none;
                border: 1px solid rgba(255, 255, 255, 0.28);
                border-radius: 6px;
                padding: 7px 12px;
            }

            main {
                max-width: 960px;
                margin: 28px auto;
                padding: 0 20px 40px;
            }

            .panel {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                box-shadow: var(--shadow);
                padding: 22px;
                margin-bottom: 18px;
            }

            h1 {
                font-size: 24px;
                margin: 0 0 4px;
            }

            .subtitle {
                color: var(--muted);
                margin: 0;
                font-size: 14px;
            }

            #uploadfile {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                align-items: center;
            }

            input[type="file"] {
                flex: 1 1 260px;
                min-height: 42px;
                border: 1px dashed var(--line);
                border-radius: 6px;
                background: var(--surface);
                padding: 9px 10px;
            }

            input[type="submit"] {
                height: 42px;
                border: 0;
                border-radius: 6px;
                background: var(--accent);
                color: white;
                font-weight: 700;
                padding: 0 18px;
                cursor: pointer;
            }

            input[type="submit"]:hover {
                background: var(--accent-dark);
            }

            .table-wrap {
                overflow-x: auto;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--surface);
            }

            table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
                font-size: 14px;
            }

            thead td {
                color: var(--muted);
                font-weight: 700;
                background: #eef3f7;
                border-bottom: 1px solid var(--line);
                padding: 12px 14px;
            }

            tbody td {
                border-bottom: 1px solid var(--line);
                padding: 13px 14px;
            }

            tbody tr:last-child td {
                border-bottom: 0;
            }

            .col-name {
                width: auto;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .col-action {
                width: 110px;
                text-align: center;
            }

            .link {
                color: var(--accent);
                text-decoration: none;
                font-weight: 700;
            }

            .danger {
                color: var(--danger);
            }

            #overlay {
                display: none;
                position: fixed;
                inset: 0;
                place-items: center;
                background: rgba(16, 20, 24, 0.58);
                color: white;
                font-size: 16px;
                font-weight: 700;
            }
        </style>
    </head>
    <body>
        <div id="overlay">Uploading...</div>

        <header class="topbar">
            <div class="topbar-inner">
                <div class="brand">WebFileServer</div>
                <div class="userbox">
                    <span>{{username}}</span>
                    <a class="logout" href="/logout">Logout</a>
                </div>
            </div>
        </header>

        <main>
            <section class="panel">
                <h1>Private Cloud</h1>
                <p class="subtitle">Upload, download, and delete files in your own private space.</p>
            </section>

            <section class="panel">
                <form id="uploadfile" action="/upload" method="post" enctype="multipart/form-data">
                    <input type="file" id="upload" name="upload" required>
                    <input type="submit" onclick="uploadWin()" value="Upload">
                </form>
            </section>

            <section class="panel">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <td class="col-name">File name</td>
                                <td class="col-action"></td>
                                <td class="col-action"></td>
                            </tr>
                        </thead>
                        <tbody>
<!--filelist_label-->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </body>
</html>
